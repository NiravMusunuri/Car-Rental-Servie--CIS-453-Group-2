{% load static %}{% if car.image %}<img class="vehicle-image" src="{{ car.image.url }}" alt="{{ car.make }} {{ car.model }}" loading="lazy">{% elif car.image_path %}<img class="vehicle-image" src="{% static car.image_path %}" alt="{{ car.make }} {{ car.model }} — representative vehicle image" width="1536" height="1024" loading="lazy">{% else %}<div class="photo-placeholder"><span>{{ car.make }} {{ car.model }}</span><small>Photo coming soon</small></div>{% endif %}
