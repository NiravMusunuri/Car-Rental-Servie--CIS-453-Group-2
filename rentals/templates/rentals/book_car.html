<!DOCTYPE html>
<html>
<head>
    <title>Book Car</title>
</head>
<body>

<h1>Book {{ car.year }} {{ car.make }} {{ car.model }}</h1>

<p>Category: {{ car.category.name }}</p>
<p>Daily Rate: ${{ car.category.daily_rate }}</p>

<hr>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Confirm Booking</button>
</form>

<p>
    <a href="{% url 'car_list' %}">Back to Cars</a>
</p>

</body>
</html>
